<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">J-UI Argo 数据流</title>
  <desc id="desc">客户端经过 Cloudflare 和 Cloudflare Tunnel 连接到 VPS 本机的 J-UI Argo 入站。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <text x="60" y="72" fill="#1e293b" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">J-UI Argo 是怎样连接的？</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(60 135)">
      <rect width="220" height="150" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
      <circle cx="110" cy="48" r="25" fill="#e0e7ff"/>
      <text x="110" y="57" font-size="28">📱</text>
      <text x="110" y="95" fill="#1e293b" font-size="22" font-weight="700">代理客户端</text>
      <text x="110" y="125" fill="#64748b" font-size="16">域名 : 443</text>
    </g>
    <path d="M290 210H370" stroke="#6366f1" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="330" y="188" fill="#475569" font-size="15">WS + TLS</text>
    <g transform="translate(390 135)">
      <rect width="220" height="150" rx="24" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
      <circle cx="110" cy="48" r="25" fill="#ffedd5"/>
      <text x="110" y="57" font-size="26">☁️</text>
      <text x="110" y="95" fill="#1e293b" font-size="22" font-weight="700">Cloudflare Edge</text>
      <text x="110" y="125" fill="#64748b" font-size="16">公网 HTTPS 入口</text>
    </g>
    <path d="M620 210H700" stroke="#6366f1" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="660" y="188" fill="#475569" font-size="15">Tunnel</text>
    <g transform="translate(720 135)">
      <rect width="420" height="150" rx="24" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
      <text x="210" y="47" fill="#047857" font-size="21" font-weight="700">VPS 内部</text>
      <text x="210" y="82" fill="#1e293b" font-size="20" font-weight="700">cloudflared → J-UI / sing-box</text>
      <rect x="79" y="101" width="262" height="34" rx="17" fill="#d1fae5"/>
      <text x="210" y="124" fill="#065f46" font-size="16">http://127.0.0.1:2080</text>
    </g>
  </g>
  <rect x="60" y="330" width="1080" height="54" rx="18" fill="#ffffff" opacity=".9"/>
  <text x="600" y="365" text-anchor="middle" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">只需开放 Cloudflare 公网域名；VPS 的 2080 端口仅监听本机，不需要开放防火墙。</text>
</svg>
