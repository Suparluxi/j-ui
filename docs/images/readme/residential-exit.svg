<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">J-UI 住宅代理出口</title><desc id="desc">原有入站节点可以绑定独立的手动代理或 VPNGate 隔离出口。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs>
  <rect width="1200" height="400" rx="30" fill="#ecfeff"/>
  <text x="60" y="62" fill="#134e4a" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">入口协议不变，按需增加独立出口</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(70 120)"><rect width="240" height="160" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="120" y="52" font-size="28">📱</text><text x="120" y="92" fill="#334155" font-size="20" font-weight="700">客户端</text><text x="120" y="124" fill="#64748b" font-size="15">使用原节点协议连接</text></g>
    <path d="M325 200H415" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(435 120)"><rect width="310" height="160" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="155" y="50" fill="#0f766e" font-size="18" font-weight="700">J-UI 新建端口</text><text x="155" y="88" fill="#334155" font-size="19" font-weight="700">绑定现有节点配置</text><rect x="52" y="111" width="206" height="26" rx="13" fill="#ccfbf1"/><text x="155" y="129" fill="#115e59" font-size="14">入口与出口一一对应</text></g>
    <path d="M760 200H850" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(870 92)"><rect width="260" height="216" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="130" y="45" fill="#334155" font-size="18" font-weight="700">可选出口</text><rect x="28" y="68" width="204" height="48" rx="14" fill="#e0e7ff"/><text x="130" y="98" fill="#3730a3" font-size="15" font-weight="700">手动 SOCKS5 / HTTP</text><rect x="28" y="130" width="204" height="58" rx="14" fill="#dcfce7"/><text x="130" y="154" fill="#166534" font-size="15" font-weight="700">VPNGate</text><text x="130" y="176" fill="#166534" font-size="13">netns · kill switch · 到期删除</text></g>
  </g>
  <text x="600" y="356" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle">VPNGate 为第三方志愿者网络，不承诺住宅属性、速度或在线率。</text>
</svg>
