<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">J-UI isolated upstream exits</title><desc id="desc">An existing inbound node can bind to an independent manual upstream or VPNGate exit.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs>
  <rect width="1200" height="400" rx="30" fill="#ecfeff"/>
  <text x="60" y="62" fill="#134e4a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Keep the inbound protocol, add an exit when needed</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 120)"><rect width="240" height="160" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="120" y="52" font-size="28">📱</text><text x="120" y="92" fill="#334155" font-size="20" font-weight="700">Client</text><text x="120" y="124" fill="#64748b" font-size="15">Uses the existing protocol</text></g>
    <path d="M325 200H415" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(435 120)"><rect width="310" height="160" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="155" y="50" fill="#0f766e" font-size="18" font-weight="700">J-UI new port</text><text x="155" y="88" fill="#334155" font-size="19" font-weight="700">Bind existing node settings</text><rect x="52" y="111" width="206" height="26" rx="13" fill="#ccfbf1"/><text x="155" y="129" fill="#115e59" font-size="14">One inbound per exit</text></g>
    <path d="M760 200H850" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(870 92)"><rect width="260" height="216" rx="24" fill="#fff" stroke="#99f6e4" stroke-width="3"/><text x="130" y="45" fill="#334155" font-size="18" font-weight="700">Optional exits</text><rect x="28" y="68" width="204" height="48" rx="14" fill="#e0e7ff"/><text x="130" y="98" fill="#3730a3" font-size="15" font-weight="700">Manual SOCKS5 / HTTP</text><rect x="28" y="130" width="204" height="58" rx="14" fill="#dcfce7"/><text x="130" y="154" fill="#166534" font-size="15" font-weight="700">VPNGate</text><text x="130" y="176" fill="#166534" font-size="13">netns · fail closed · auto-cleanup</text></g>
  </g>
  <text x="600" y="356" fill="#475569" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">VPNGate is a third-party volunteer network; location, speed, and uptime are not guaranteed.</text>
</svg>
