<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">J-UI overview</title><desc id="desc">One page for system status, nodes, upstream exits, and subscriptions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient></defs>
  <rect width="1200" height="540" rx="32" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="67" fill="#1e293b" font-size="31" font-weight="700" xml:space="preserve">Easy subscription   Easy management</text>
    <text x="60" y="101" fill="#64748b" font-size="17">Common node management in one lightweight, self-hosted page</text>
    <rect x="60" y="132" width="1080" height="344" rx="25" fill="#fff" stroke="#c7d2fe" stroke-width="3"/>
    <rect x="90" y="160" width="1020" height="58" rx="18" fill="#1e293b"/>
    <text x="120" y="196" fill="#fff" font-size="23" font-weight="700">J-UI</text>
    <text x="600" y="196" fill="#6ee7b7" font-size="16" text-anchor="middle">● Live monitoring</text>
    <text x="1075" y="196" fill="#cbd5e1" font-size="16" text-anchor="end">Subscriptions · Settings</text>
    <g transform="translate(90 246)">
      <rect width="314" height="190" rx="20" fill="#f8fafc"/>
      <text x="24" y="38" fill="#334155" font-size="18" font-weight="700">System status</text>
      <circle cx="80" cy="104" r="42" fill="none" stroke="#e2e8f0" stroke-width="13"/><path d="M80 62a42 42 0 0 1 38 60" fill="none" stroke="#6366f1" stroke-width="13" stroke-linecap="round"/>
      <text x="80" y="111" fill="#1e293b" font-size="18" font-weight="700" text-anchor="middle">28%</text>
      <text x="154" y="91" fill="#64748b" font-size="15">CPU · Memory · Disk</text>
      <text x="154" y="121" fill="#64748b" font-size="15">Traffic · Services</text>
      <text x="154" y="151" fill="#059669" font-size="15" font-weight="700">All systems normal</text>
    </g>
    <g transform="translate(423 246)">
      <rect width="334" height="190" rx="20" fill="#f8fafc"/>
      <text x="24" y="38" fill="#334155" font-size="18" font-weight="700">Node management</text>
      <g transform="translate(24 62)">
        <rect width="286" height="42" rx="12" fill="#eef2ff"/><circle cx="22" cy="21" r="7" fill="#22c55e"/><text x="42" y="27" fill="#334155" font-size="15">XTLS-Reality_8881</text>
        <rect y="52" width="286" height="42" rx="12" fill="#ecfeff"/><circle cx="22" cy="73" r="7" fill="#22c55e"/><text x="42" y="79" fill="#334155" font-size="15">Hysteria2_8882</text>
        <rect y="104" width="286" height="42" rx="12" fill="#fff7ed"/><circle cx="22" cy="125" r="7" fill="#22c55e"/><text x="42" y="131" fill="#334155" font-size="15">Argo · fixed-domain backup</text>
      </g>
    </g>
    <g transform="translate(776 246)">
      <rect width="334" height="190" rx="20" fill="#f8fafc"/>
      <text x="24" y="38" fill="#334155" font-size="18" font-weight="700">Subscriptions and exits</text>
      <rect x="24" y="62" width="286" height="47" rx="14" fill="#dcfce7"/><text x="167" y="92" fill="#166534" font-size="15" font-weight="700" text-anchor="middle">v2rayN · Clash · sing-box</text>
      <rect x="24" y="120" width="286" height="47" rx="14" fill="#e0e7ff"/><text x="167" y="150" fill="#3730a3" font-size="15" font-weight="700" text-anchor="middle">Manual upstream · VPNGate exit</text>
    </g>
